[tools]
dotnet = "10.0"

# === Infrastructure tasks (not daemon-backed) ===

[tasks.restore]
description = "Restore dependencies"
run = "dotnet restore"

[tasks.tool-restore]
description = "Restore local dotnet tools"
run = "dotnet tool restore"

# === Daemon-backed tasks ===
# `check` is the single daemon-backed inner loop (build + lint + analyze + test +
# format-check folded into one). The old per-plugin verbs (build/test/lint/
# errors/format-check) were retired — use `fshw check` to verify and `fshw status`
# to observe. `build` here just compiles the CLI binary so the `--no-build`
# daemon-backed tasks below have something to run.

[tasks.build]
description = "Compile ONLY the CLI binary, so --no-build daemon tasks can run. Use `compile` to build the solution: this does NOT compile the tests, and returns 0 when they do not."
run = "dotnet build src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj"
depends = ["restore", "build-analyzers"]

[tasks.build-analyzers]
description = "Materialize EVERY analyzer path in .fshw.json analyzers.paths (house rules + the FSharpLint shim)"
# One entry per `.fshw.json` `analyzers.paths` element, in the same order. The daemon
# loads analyzers at startup and REFUSES to start when a configured path yields zero
# (DaemonConfig.analyzerPathFailures) — an unloaded analyzer and a clean one are
# indistinguishable from the outside, so it fails loud rather than running green
# without the house rules. That makes this the prerequisite of every daemon-backed
# task, not just `check`: the failure that exposed it was `mise run format` in a clean workspace
# dying on the missing shim bin, and "passing" only on a workspace where some earlier
# `dotnet build` had happened to populate it. An array, not a multi-line script: mise
# runs the entries in order and stops at the first non-zero exit, so a shim that cannot
# be restored fails THIS task by name instead of surfacing later as a daemon error.
# `tests/FsHotWatch.Tests/AnalyzerMaterializationTests.fs` pins this list to the config.
run = [
  "dotnet build tools/fsharplint-shim/fsharplint-shim.csproj",
  "dotnet build analyzers/FsHotWatch.Rules/FsHotWatch.Rules.fsproj",
]
depends = ["restore"]

[tasks.format]
description = "Format code via daemon"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- format"
depends = ["build"]

[tasks.status]
description = "Show current status / accumulated errors from the daemon (no run triggered)"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- status"
depends = ["build"]

[tasks.check]
description = "Run all checks via daemon (auto-starts daemon if needed)"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- check"
depends = ["build", "lint-project", "coverage-check"]
# Note: depends on build to ensure CLI binary is compiled.
# The daemon handles its own build/test/lint cycle internally.
#
# `coverage-check`, NOT `coverage-ratchet`, and the difference is the gate itself.
#
# A verdict is content-addressed by the tree it judged, and `coverage-ratchet-FsHotWatch.json`
# is a DECLARED VERDICT INPUT (`.fshw.json` `verdictInputs.hashed`, whose `why` reads:
# "Lower one and a verdict earned under the higher floor must stop applying; hashing it
# is the only thing that makes that true"). `coverage-ratchet` REWRITES that file. Hung
# off `check`, the writer sat inside the reader's own dependency closure: the gate edited
# the bytes its answer is keyed to, in the run that produced the answer. That is why
# `fshw verdict` answered `StaleTree` about this repository's own check, and why landing
# work here needed a recorded exception instead of a green.
#
# The second half is worse than the staleness. The old wrapper ran `ratchet`, read exit 2
# — "a file is BELOW its floor" — and answered it by running `loosen`, which sets the
# threshold down to current coverage. The inner-loop gate resolved a coverage regression
# by lowering the bar until it passed: its success was unconditional. A check that
# repairs its own criterion cannot fail, and this one left its fingerprints in the floors
# file — seven entries whose entire recorded justification is "loosened automatically",
# and a 2026-08-07 repair note carried by 32 of the 131 floor entries after an auto-ratchet
# pass pinned floors to a single run's measurement and "two such floors went red on the
# next run".
#
# So observing and repairing are two commands now. This one OBSERVES: `coverage-check`
# reads the floors, fails on a regression, and writes nothing — and it is the same task
# `ci` depends on, so a local green and a CI green are the same claim rather than two that
# can drift. Repairing is explicit: `mise run coverage-ratchet` tightens,
# `mise run loosen-from-ci` re-baselines from BOTH platforms' CI artifacts (which is what
# the floors file's own reasons prescribe — "re-baseline from CI on BOTH platforms, not
# one local run" — and what an inner-loop auto-tighten on one developer's machine
# structurally cannot do), and `mise run coverage-loosen` lowers them. Each is a reviewable
# diff, and because the floors file is hashed, each one invalidates the verdict and forces
# a re-gate under the floors it just moved.
#
# `tests/FsHotWatch.Tests/GatePurityTests.fs` pins the separation: no task in a gate's
# dependency closure may invoke a `coverageratchet` verb that writes.
#
# Coverage must still be DETERMINISTIC here: if a test in the coverage suite causes
# coverage to fluctuate run-to-run, that test belongs in the integration suite
# (tests/FsHotWatch.IntegrationTests, no coverage) instead. What used to paper over that
# instability is the auto-loosen described above; without it a flake is a red gate, which
# is the honest report and the one that gets the test moved.

[tasks.cache-clear]
description = "Clear the check result cache (BOTH the workspace store and the box-wide shared one)"
# Not `rm -rf .fshw/cache/` alone: since the cross-workspace shared cache, the pure-content
# plugins' entries live in a box-wide store OUTSIDE the checkout, and deleting only the
# workspace half leaves those replaying.
#
# The second path takes every repository's shared entries, not just this one's. That
# is deliberate: the per-repository namespace is a digest, so naming just this repo's
# share from a shell means recomputing that digest here — a second spelling of an
# identity that must not be allowed to disagree. These are caches; over-deleting costs
# one cold run on another repository and cannot be wrong.
run = [
  "rm -rf .fshw/cache/",
  "rm -rf \"${FSHW_CACHE_HOME:-${XDG_CACHE_HOME:-$HOME/.cache}/fshw}/cache/tasks\"",
]

# === Direct tasks (CI, docs, packaging) ===

[tasks.test-direct]
description = "Run tests directly with coverage (for CI). Excludes IntegrationTests whose SDK-reflection paths fire nondeterministically and make the coverage ratchet flaky."
# Wipe any stale per-project coverage the daemon may have written to
# coverage/<project>/ in prior runs — coverageratchet walks the tree and
# would otherwise see TestPrune.Core sources (from the sibling ProjectReference)
# that aren't filtered by coverage.settings in the daemon path.
run = """
rm -rf coverage
dotnet test --project tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/coverage.cobertura.xml" \
  --coverage-settings "$PWD/coverage.settings"
"""
# depends on `compile`, not just `restore`: `mise run ci` fans out to
# {compile, lint-project, coverage-check→test-direct} in PARALLEL, and both
# `compile` and this task drive MSBuild over the same output directories. They
# collided writing FsHotWatch.Cli.deps.json ("the process cannot access the
# file … used by another process" → MSB4018, and a child node exiting
# prematurely took the test run down with it). Ordering them behind one build
# removes the race: a check that can go red from its own internal contention
# tells you nothing about the code.
depends = ["restore", "compile"]

[tasks.test-integration]
description = "Run integration tests (FCS / analyzers / lint / format / build end-to-end). No coverage."
run = "dotnet test --project tests/FsHotWatch.IntegrationTests/FsHotWatch.IntegrationTests.fsproj"
depends = ["restore"]

[tasks.test-bench]
description = "Unit-test the benchmark harness's pure parts (bench/). No coverage: measurement tooling, not shipped code."
run = "dotnet test --project bench/FsHotWatch.Bench.Tests/FsHotWatch.Bench.Tests.fsproj"
depends = ["restore"]

[tasks.bench-memory]
description = "Repository-host memory/scan benchmark: 1, 2 and 4 concurrent worktree daemons, 5 reps. Run on a QUIET box; see bench/README.md. Extra args pass through (e.g. -- --tests)."
run = "dotnet build bench/FsHotWatch.Bench/FsHotWatch.Bench.fsproj && dotnet bench/FsHotWatch.Bench/bin/Debug/net10.0/fshw-bench.dll run --repo ."
depends = ["build"]

[tasks.coverage-check]
description = "Check per-file coverage meets minimum threshold"
run = "dotnet tool run coverageratchet check coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.coverage-ratchet]
description = "Tighten coverage thresholds to current coverage. EXPLICIT — never a gate dependency."
# TIGHTEN ONLY, and run by a person. This task rewrites a declared verdict input, so it
# is the kind of thing that belongs in a commit somebody signed for, not in the closure
# of the command that decides whether the tree is green — see `[tasks.check]`.
#
# The loosen fallback that used to live here is gone. It answered "a file is below its
# floor" — the one finding this whole mechanism exists to produce — by moving the floor
# down to meet it. Loosening is still available as `mise run coverage-loosen`, where the
# decision is visible and has to be defended in the diff, and `mise run loosen-from-ci`
# re-baselines from both platforms' CI artifacts, which is the path the floors file's own
# reasons ask for.
#
# Exit codes: 0 = tightened and 1 = nothing to tighten are both success ("the floors
# already match what the suite achieves" is not a failure). 2 = a file is BELOW its floor
# and is REPORTED, not repaired. Anything else is a tool crash and propagates unchanged,
# so a misbehaving tool never silently rewrites thresholds.
run = """sh -c '
  dotnet tool run coverageratchet ratchet coverage-ratchet-FsHotWatch.json
  c=$?
  if [ $c -eq 0 ] || [ $c -eq 1 ]; then exit 0; fi
  exit $c
'"""
depends = ["test-direct"]

[tasks.coverage-loosen]
description = "Loosen coverage thresholds to current values"
run = "dotnet tool run coverageratchet loosen coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.loosen-from-ci]
description = "Merge coverage thresholds from CI artifacts"
run = "dotnet tool run coverageratchet loosen-from-ci coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.lint-project]
description = "Lint fsproj files"
run = "dotnet tool run fsprojlint"
depends = ["tool-restore"]

[tasks.check-api]
description = "Preview the version bumps the next release would make (API diff vs last release)"
run = "dotnet tool run fssemantictagger release --dry-run"
depends = ["restore"]

[tasks.sync-docs]
description = "Sync README content to docs/"
run = "dotnet tool run syncdocs sync"

[tasks.sync-docs-check]
description = "Check if docs/ is in sync with READMEs"
run = "dotnet tool run syncdocs check"

[tasks.release]
description = "Release every package; the tagger orders publication by the dependency graph"
# This used to hand-order the release: three scoped invocations (core, then the seven
# plugins, then the CLI) with nine exact-version restore barriers between them. That
# existed because the tagger pushed every tag at once, in config order — so a CLI tag
# could be pushed before the dependency versions its nuspec names were published, and
# the correct order held only when the dependency's workflow happened to finish first.
#
# The tagger now derives a publication DAG from the project references and releases in
# waves, waiting for each wave's exact versions on NuGet before pushing the next, and
# failing closed when a dependency does not arrive. So the ordering this task performed
# by hand is now performed by the thing that pushes the tags — which is also the only
# place that can do it correctly, since config order is WRONG here: the CLI is listed
# second while it bundles every plugin listed after it. `mise run release-dry-run`
# prints the order it will use.
#
# One barrier is kept, on the CLI and only the CLI. It is not ordering anything — the
# CLI is last — it is the end-to-end proof that the published tool actually installs and
# runs, which is a stronger claim than "the feed answers 200" and the one thing the
# tagger's own poll does not establish. The eight it replaces were asking a question the
# tagger now asks itself, one wave earlier.
#
# `--skip-nuget-wait` because otherwise the LAST wave is confirmed twice. After pushing
# the final wave's tags the tagger polls nuget.org for those same versions for up to 20
# minutes and exits 2 if the index has not caught up, and the barrier below then asks the
# identical question again. That is not a harmless double-check: it fails the release on
# the WEAKER probe before the stronger one runs, which is how an indexing lag gets
# reported as a failed publish on a release whose tags are pushed and whose packages
# arrive minutes later. The flag skips ONLY that final self-confirmation — the inter-wave
# gates above are correctness, not a timeout, and are not skippable by it. Measured
# 2026-09-18: the feed served a new CLI version four minutes before a real install of it
# succeeded, so the index answering is genuinely the weaker claim.
run = """
dotnet tool run fssemantictagger release --skip-nuget-wait
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Cli src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj
"""
# `check-msbuild-deps` on the RELEASE path, not just the `ci` one.
# The first attempt at this guard hung it off `ci` alone, and `ci` is a task a human
# runs — so the one moment it existed to protect, cutting a tag, never invoked it. mise
# refuses to run a task whose dependency exited non-zero, which is what makes this a
# gate rather than a suggestion. It is belt to the remote braces: the tagger requires a
# green CI run, and CI's own command now runs the same check first (`.github/workflows/ci.yml`).
depends = ["restore", "check-msbuild-deps"]

[tasks.release-dry-run]
description = "Preview a release without mutating (no tag, no publish)"
run = "dotnet tool run fssemantictagger release --dry-run"
# Deliberately one unscoped preview: it reports the exact complete set of versions the
# ordered release above will emit without introducing publication waits or mutations.
# Same dependency as `release`: a dry run that skips a gate the real run applies is a
# preview of a different release.
depends = ["restore", "check-msbuild-deps"]

[tasks.compile]
description = "Compile the solution (dotnet build)"
run = "dotnet build"
depends = ["restore"]

[tasks.ci]
description = "Run the full-suite confirm (single pass, no daemon) — the same command GitHub Actions runs"
# `confirm`, not `check`: the full suite runs UNFILTERED and a green verdict is refused
# (exit 3) from anything less. `check` keeps impact filtering, which is a latency
# optimization for the inner loop and not the basis for a merge decision.
#
# This MUST stay identical to `lint-cmd` in .github/workflows/ci.yml. A local `ci` that
# runs a different command from the real CI is a local `ci` that can go green on work
# CI will reject — the drift is the bug.
#
# The `check-msbuild-deps` prefix is here, in the COMMAND, rather than in `depends`
# below: `depends` is a mise concept and remote CI does not run mise — it runs this
# string. Hung off `depends` alone the guard fired only when a human ran `mise run ci`,
# which is not the path a package reaches NuGet by.
run = "dotnet fsi scripts/check-msbuild-deps.fsx && dotnet run --project src/FsHotWatch.Cli --no-build -- confirm --run-once"
# `sync-docs-check`: the examples are compiled (they are members of FsHotWatch.slnx),
# and the README/docs code blocks are SOURCED from them via syncdocs `src=` regions.
# Compiling the example proves the code is real; only this check proves the block a
# reader actually copies still MATCHES it. Without it the drift guard was a guard
# nothing ran — an unenforced check and a passing one look alike from the outside,
# which is the very thing this repo refuses to ship.
# `check-msbuild-deps` is NOT listed here — it is in the `run` command above, so
# that CI runs it too. `compile` stays, because the check reads a BUILT deps.json.
depends = ["compile", "lint-project", "coverage-check", "sync-docs-check"]

[tasks.check-msbuild-deps]
description = "Verify app-local MSBuild support assemblies are not downgraded"
run = "dotnet fsi scripts/check-msbuild-deps.fsx"
depends = ["compile"]

[tasks.run]
description = "Run the CLI"
run = "dotnet run --project src/FsHotWatch.Cli --"
# Same daemon, same startup analyzer load as `format`/`status`/`check`.
depends = ["restore", "build-analyzers"]

[tasks.pack]
description = "Create NuGet packages"
run = """
dotnet pack src/FsHotWatch/FsHotWatch.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.TestPrune/FsHotWatch.TestPrune.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Analyzers/FsHotWatch.Analyzers.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Lint/FsHotWatch.Lint.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Fantomas/FsHotWatch.Fantomas.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Build/FsHotWatch.Build.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.FileCommand/FsHotWatch.FileCommand.fsproj -c Release -o artifacts
"""
# The packages this produces are what `release.yml` pushes to NuGet, so the
# app-local MSBuild assemblies are checked BEFORE anything is packed.
# The check reads a BUILT `FsHotWatch.Cli.deps.json`, and package
# versions are resolved per project rather than per configuration, so the `compile`
# output it depends on is evidence about this pack too.
depends = ["restore", "check-msbuild-deps"]

[tasks.docs]
description = "Generate API documentation"
run = "dotnet fsdocs build --output output/docs --clean --parameters root /FsHotWatch/"
depends = ["restore", "tool-restore"]

[tasks.docs-watch]
description = "Watch and serve documentation locally"
run = "dotnet fsdocs watch"
depends = ["restore", "tool-restore"]
