[tools]
dotnet = "10.0"

# === Infrastructure tasks (not daemon-backed) ===

[tasks.restore]
description = "Restore dependencies"
run = "dotnet restore"

[tasks.tool-restore]
description = "Restore local dotnet tools"
run = "dotnet tool restore"

# === Daemon-backed tasks ===
# `check` is the single daemon-backed inner loop (build + lint + analyze + test +
# format-check folded into one). The old per-plugin verbs (build/test/lint/
# errors/format-check) were retired — use `fshw check` to verify and `fshw status`
# to observe. `build` here just compiles the CLI binary so the `--no-build`
# daemon-backed tasks below have something to run.

[tasks.build]
description = "Compile the CLI binary (so --no-build daemon tasks can run)"
run = "dotnet build src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj"
depends = ["restore", "build-analyzers"]

[tasks.build-analyzers]
description = "Materialize EVERY analyzer path in .fshw.json analyzers.paths (house rules + the FSharpLint shim)"
# One entry per `.fshw.json` `analyzers.paths` element, in the same order. The daemon
# loads analyzers at startup and REFUSES to start when a configured path yields zero
# (DaemonConfig.analyzerPathFailures) — an unloaded analyzer and a clean one are
# indistinguishable from the outside, so it fails loud rather than running green
# without the house rules. That makes this the prerequisite of every daemon-backed
# task, not just `check`: AUTOMATION-448 was `mise run format` in a clean workspace
# dying on the missing shim bin, and "passing" only on a workspace where some earlier
# `dotnet build` had happened to populate it. An array, not a multi-line script: mise
# runs the entries in order and stops at the first non-zero exit, so a shim that cannot
# be restored fails THIS task by name instead of surfacing later as a daemon error.
# `tests/FsHotWatch.Tests/AnalyzerMaterializationTests.fs` pins this list to the config.
run = [
  "dotnet build tools/fsharplint-shim/fsharplint-shim.csproj",
  "dotnet build analyzers/FsHotWatch.Rules/FsHotWatch.Rules.fsproj",
]
depends = ["restore"]

[tasks.format]
description = "Format code via daemon"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- format"
depends = ["build"]

[tasks.status]
description = "Show current status / accumulated errors from the daemon (no run triggered)"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- status"
depends = ["build"]

[tasks.check]
description = "Run all checks via daemon (auto-starts daemon if needed)"
run = "dotnet run --project src/FsHotWatch.Cli --no-build -- check"
depends = ["build", "lint-project", "coverage-ratchet"]
# Note: depends on build to ensure CLI binary is compiled.
# The daemon handles its own build/test/lint cycle internally.
# Uses coverage-ratchet (auto-tighten) on purpose: this is the dev-tool entry
# point, and like Fantomas auto-fixing format on save, the threshold file is
# auto-corrected to lock in coverage gains as they happen.
# This requires coverage to be DETERMINISTIC: if a test in the coverage suite
# causes coverage to fluctuate run-to-run, that test belongs in the integration
# suite (tests/FsHotWatch.IntegrationTests, no coverage) instead. Don't paper
# over instability by loosening thresholds — fix the test placement.
# CI uses `mise run ci`, which invokes `coverage-check` and fails on regression.

[tasks.cache-clear]
description = "Clear the check result cache"
run = "rm -rf .fshw/cache/"

# === Direct tasks (CI, docs, packaging) ===

[tasks.test-direct]
description = "Run tests directly with coverage (for CI). Excludes IntegrationTests whose SDK-reflection paths fire nondeterministically and make the coverage ratchet flaky."
# Wipe any stale per-project coverage the daemon may have written to
# coverage/<project>/ in prior runs — coverageratchet walks the tree and
# would otherwise see TestPrune.Core sources (from the sibling ProjectReference)
# that aren't filtered by coverage.settings in the daemon path.
run = """
rm -rf coverage
dotnet test --project tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/coverage.cobertura.xml" \
  --coverage-settings "$PWD/coverage.settings"
"""
# depends on `compile`, not just `restore`: `mise run ci` fans out to
# {compile, lint-project, coverage-check→test-direct} in PARALLEL, and both
# `compile` and this task drive MSBuild over the same output directories. They
# collided writing FsHotWatch.Cli.deps.json ("the process cannot access the
# file … used by another process" → MSB4018, and a child node exiting
# prematurely took the test run down with it). Ordering them behind one build
# removes the race: a check that can go red from its own internal contention
# tells you nothing about the code.
depends = ["restore", "compile"]

[tasks.test-integration]
description = "Run integration tests (FCS / analyzers / lint / format / build end-to-end). No coverage."
run = "dotnet test --project tests/FsHotWatch.IntegrationTests/FsHotWatch.IntegrationTests.fsproj"
depends = ["restore"]

[tasks.coverage-check]
description = "Check per-file coverage meets minimum threshold"
run = "dotnet tool run coverageratchet check coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.coverage-ratchet]
description = "Auto-correct coverage thresholds: tighten on rise, shrink on drift"
# Try ratchet (tightens on rising coverage; preferred when coverage actually
# improves). Fall back to loosen if any file has fallen below threshold so
# the dev loop continues. Net effect: thresholds always track current
# coverage, locking in gains, accepting noise.
# CI uses `mise run ci` → `coverage-check` (no auto-correct) to gate on
# real regressions. Coverage drift on borderline files is a test-suite bug
# (move flaky tests to FsHotWatch.IntegrationTests, no coverage); this
# wrapper exists so dev velocity isn't blocked while flakes get cleaned up.
run = """sh -c '
  dotnet tool run coverageratchet ratchet coverage-ratchet-FsHotWatch.json
  c=$?
  # 0 = tightened, 1 = nothing to tighten — both fine.
  # 2 = below threshold (drift) — fall back to loosen.
  # Any other code = tool crash; propagate so we do not silently rewrite
  # thresholds when the tool itself misbehaved.
  [ $c -eq 0 ] && exit 0
  [ $c -eq 1 ] && exit 0
  [ $c -ne 2 ] && exit $c
  dotnet tool run coverageratchet loosen coverage-ratchet-FsHotWatch.json
'"""
depends = ["test-direct"]

[tasks.coverage-loosen]
description = "Loosen coverage thresholds to current values"
run = "dotnet tool run coverageratchet loosen coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.loosen-from-ci]
description = "Merge coverage thresholds from CI artifacts"
run = "dotnet tool run coverageratchet loosen-from-ci coverage-ratchet-FsHotWatch.json"
depends = ["test-direct"]

[tasks.lint-project]
description = "Lint fsproj files"
run = "dotnet tool run fsprojlint"
depends = ["tool-restore"]

[tasks.check-api]
description = "Preview the version bumps the next release would make (API diff vs last release)"
run = "dotnet tool run fssemantictagger release --dry-run"
depends = ["restore"]

[tasks.sync-docs]
description = "Sync README content to docs/"
run = "dotnet tool run syncdocs sync"

[tasks.sync-docs-check]
description = "Check if docs/ is in sync with READMEs"
run = "dotnet tool run syncdocs check"

[tasks.release]
description = "Release dependency packages before the CLI that bundles them"
# FsHotWatch.Cli has a ProjectReference to core and every plugin below. The tagger's
# NuGet poll is best-effort (its documented timeout still exits 0), so each scoped
# dependency level is followed by fail-closed exact-version restore barriers. The CLI tag
# therefore cannot race publication of the dependency versions its nuspec names. An
# unchanged lane probes its already-published current version. Keep the CLI last, and
# do not collapse this to one unscoped invocation: tag workflows are independent.
run = """
dotnet tool run fssemantictagger release --only FsHotWatch
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch src/FsHotWatch/FsHotWatch.fsproj
dotnet tool run fssemantictagger release --only FsHotWatch.TestPrune,FsHotWatch.Analyzers,FsHotWatch.Lint,FsHotWatch.Fantomas,FsHotWatch.Build,FsHotWatch.FileCommand,FsHotWatch.Coverage
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.TestPrune src/FsHotWatch.TestPrune/FsHotWatch.TestPrune.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Analyzers src/FsHotWatch.Analyzers/FsHotWatch.Analyzers.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Lint src/FsHotWatch.Lint/FsHotWatch.Lint.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Fantomas src/FsHotWatch.Fantomas/FsHotWatch.Fantomas.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Build src/FsHotWatch.Build/FsHotWatch.Build.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.FileCommand src/FsHotWatch.FileCommand/FsHotWatch.FileCommand.fsproj
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Coverage src/FsHotWatch.Coverage/FsHotWatch.Coverage.fsproj
dotnet tool run fssemantictagger release --only FsHotWatch.Cli
dotnet fsi scripts/wait-for-nuget.fsx -- FsHotWatch.Cli src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj
"""
# `check-msbuild-deps` on the RELEASE path, not just the `ci` one (AUTOMATION-290).
# The first attempt at this guard hung it off `ci` alone, and `ci` is a task a human
# runs — so the one moment it existed to protect, cutting a tag, never invoked it. mise
# refuses to run a task whose dependency exited non-zero, which is what makes this a
# gate rather than a suggestion. It is belt to the remote braces: the tagger requires a
# green CI run, and CI's own command now runs the same check first (`.github/workflows/ci.yml`).
depends = ["restore", "check-msbuild-deps"]

[tasks.release-dry-run]
description = "Preview a release without mutating (no tag, no publish)"
run = "dotnet tool run fssemantictagger release --dry-run"
# Deliberately one unscoped preview: it reports the exact complete set of versions the
# ordered release above will emit without introducing publication waits or mutations.
# Same dependency as `release`: a dry run that skips a gate the real run applies is a
# preview of a different release.
depends = ["restore", "check-msbuild-deps"]

[tasks.compile]
description = "Compile the solution (dotnet build)"
run = "dotnet build"
depends = ["restore"]

[tasks.ci]
description = "Run the full-suite confirm (single pass, no daemon) — the same command GitHub Actions runs"
# `confirm`, not `check`: the full suite runs UNFILTERED and a green verdict is refused
# (exit 3) from anything less. `check` keeps impact filtering, which is a latency
# optimization for the inner loop and not the basis for a merge decision.
#
# This MUST stay identical to `lint-cmd` in .github/workflows/ci.yml. A local `ci` that
# runs a different command from the real CI is a local `ci` that can go green on work
# CI will reject — the drift is the bug (AUTOMATION-117).
#
# The `check-msbuild-deps` prefix is here, in the COMMAND, rather than in `depends`
# below: `depends` is a mise concept and remote CI does not run mise — it runs this
# string. Hung off `depends` alone the guard fired only when a human ran `mise run ci`,
# which is not the path a package reaches NuGet by (AUTOMATION-290).
run = "dotnet fsi scripts/check-msbuild-deps.fsx && dotnet run --project src/FsHotWatch.Cli --no-build -- confirm --run-once"
# `sync-docs-check`: the examples are compiled (they are members of FsHotWatch.slnx),
# and the README/docs code blocks are SOURCED from them via syncdocs `src=` regions.
# Compiling the example proves the code is real; only this check proves the block a
# reader actually copies still MATCHES it. Without it the drift guard was a guard
# nothing ran — an unenforced check and a passing one look alike from the outside,
# which is the very thing this repo refuses to ship.
# `check-msbuild-deps` is NOT listed here — it is in the `run` command above, so
# that CI runs it too. `compile` stays, because the check reads a BUILT deps.json.
depends = ["compile", "lint-project", "coverage-check", "sync-docs-check"]

[tasks.check-msbuild-deps]
description = "Verify app-local MSBuild support assemblies are not downgraded (AUTOMATION-290)"
run = "dotnet fsi scripts/check-msbuild-deps.fsx"
depends = ["compile"]

[tasks.run]
description = "Run the CLI"
run = "dotnet run --project src/FsHotWatch.Cli --"
# Same daemon, same startup analyzer load as `format`/`status`/`check` (AUTOMATION-448).
depends = ["restore", "build-analyzers"]

[tasks.pack]
description = "Create NuGet packages"
run = """
dotnet pack src/FsHotWatch/FsHotWatch.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.TestPrune/FsHotWatch.TestPrune.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Analyzers/FsHotWatch.Analyzers.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Lint/FsHotWatch.Lint.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Fantomas/FsHotWatch.Fantomas.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.Build/FsHotWatch.Build.fsproj -c Release -o artifacts
dotnet pack src/FsHotWatch.FileCommand/FsHotWatch.FileCommand.fsproj -c Release -o artifacts
"""
# The packages this produces are what `release.yml` pushes to NuGet, so the
# app-local MSBuild assemblies are checked BEFORE anything is packed
# (AUTOMATION-290). The check reads a BUILT `FsHotWatch.Cli.deps.json`, and package
# versions are resolved per project rather than per configuration, so the `compile`
# output it depends on is evidence about this pack too.
depends = ["restore", "check-msbuild-deps"]

[tasks.docs]
description = "Generate API documentation"
run = "dotnet fsdocs build --output output/docs --clean --parameters root /FsHotWatch/"
depends = ["restore", "tool-restore"]

[tasks.docs-watch]
description = "Watch and serve documentation locally"
run = "dotnet fsdocs watch"
depends = ["restore", "tool-restore"]
