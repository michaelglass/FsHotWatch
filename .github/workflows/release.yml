name: Release

on:
  push:
    tags:
      - "core-v*"
      - "cli-v*"
      - "testprune-v*"
      - "analyzers-v*"
      - "lint-v*"
      - "fantomas-v*"
      - "build-v*"
      - "filecommand-v*"
      - "coverage-v*"
      # TestPrune (imported from michaelglass/TestPrune, AUTOMATION-1367; prefixes renamed tp-*)
      - "tp-core-v*"
      - "tp-falco-v*"
      - "tp-analyzers-v*"
      - "tp-sql-v*"
      - "tp-sqlhydra-v*"
      - "tp-trace-v*"

permissions:
  contents: write
  id-token: write

# --- core (FsHotWatch) ---

jobs:
  release-core:
    if: startsWith(github.ref, 'refs/tags/core-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch
      tag-prefix: core-v
      fsproj-path: src/FsHotWatch/FsHotWatch.fsproj
    permissions:
      contents: write

  publish-core:
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: release-core
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- cli (FsHotWatch.Cli, own cli-v tag; bundles the plugins) ---

  release-cli:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Cli
      tag-prefix: cli-v
      fsproj-path: src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj
      # The reusable workflow has already restored at this point. Build the CLI
      # from that exact assets file, guard its deps manifest, then make the
      # workflow's Release build reuse the restore and its pack reuse the build.
      pre-build-cmd: >-
        dotnet build src/FsHotWatch.Cli/FsHotWatch.Cli.fsproj
        -c Release --no-restore -p:ReleaseBuild=true &&
        dotnet fsi scripts/check-msbuild-deps.fsx
      no-build-pack: true
    permissions:
      contents: write

  publish-cli:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: release-cli
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- testprune ---

  release-testprune:
    if: startsWith(github.ref, 'refs/tags/testprune-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.TestPrune
      tag-prefix: testprune-v
      fsproj-path: src/FsHotWatch.TestPrune/FsHotWatch.TestPrune.fsproj
    permissions:
      contents: write

  publish-testprune:
    if: startsWith(github.ref, 'refs/tags/testprune-v')
    needs: release-testprune
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- analyzers ---

  release-analyzers:
    if: startsWith(github.ref, 'refs/tags/analyzers-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Analyzers
      tag-prefix: analyzers-v
      fsproj-path: src/FsHotWatch.Analyzers/FsHotWatch.Analyzers.fsproj
    permissions:
      contents: write

  publish-analyzers:
    if: startsWith(github.ref, 'refs/tags/analyzers-v')
    needs: release-analyzers
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- lint ---

  release-lint:
    if: startsWith(github.ref, 'refs/tags/lint-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Lint
      tag-prefix: lint-v
      fsproj-path: src/FsHotWatch.Lint/FsHotWatch.Lint.fsproj
    permissions:
      contents: write

  publish-lint:
    if: startsWith(github.ref, 'refs/tags/lint-v')
    needs: release-lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- fantomas ---

  release-fantomas:
    if: startsWith(github.ref, 'refs/tags/fantomas-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Fantomas
      tag-prefix: fantomas-v
      fsproj-path: src/FsHotWatch.Fantomas/FsHotWatch.Fantomas.fsproj
    permissions:
      contents: write

  publish-fantomas:
    if: startsWith(github.ref, 'refs/tags/fantomas-v')
    needs: release-fantomas
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- build ---

  release-build:
    if: startsWith(github.ref, 'refs/tags/build-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Build
      tag-prefix: build-v
      fsproj-path: src/FsHotWatch.Build/FsHotWatch.Build.fsproj
    permissions:
      contents: write

  publish-build:
    if: startsWith(github.ref, 'refs/tags/build-v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- filecommand ---

  release-filecommand:
    if: startsWith(github.ref, 'refs/tags/filecommand-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.FileCommand
      tag-prefix: filecommand-v
      fsproj-path: src/FsHotWatch.FileCommand/FsHotWatch.FileCommand.fsproj
    permissions:
      contents: write

  publish-filecommand:
    if: startsWith(github.ref, 'refs/tags/filecommand-v')
    needs: release-filecommand
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- coverage ---

  release-coverage:
    if: startsWith(github.ref, 'refs/tags/coverage-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: FsHotWatch.Coverage
      tag-prefix: coverage-v
      fsproj-path: src/FsHotWatch.Coverage/FsHotWatch.Coverage.fsproj
    permissions:
      contents: write

  publish-coverage:
    if: startsWith(github.ref, 'refs/tags/coverage-v')
    needs: release-coverage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- TestPrune (tp-*: the TestPrune packages, released from here since AUTOMATION-1367) ---

  release-tp-core:
    if: startsWith(github.ref, 'refs/tags/tp-core-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune
      tag-prefix: tp-core-v
      fsproj-path: src/TestPrune.Core/TestPrune.Core.fsproj
      extra-fsproj-paths: 'src/TestPrune/TestPrune.fsproj'
    permissions:
      contents: write

  publish-tp-core:
    if: startsWith(github.ref, 'refs/tags/tp-core-v')
    needs: release-tp-core
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-tp-analyzers:
    if: startsWith(github.ref, 'refs/tags/tp-analyzers-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune.Analyzers
      tag-prefix: tp-analyzers-v
      fsproj-path: src/TestPrune.Analyzers/TestPrune.Analyzers.fsproj
      # Pack the analyzer with a full build, matching fsharp-analyzers /
      # FSharpLintAnalyzerShim.
      no-build-pack: false
    permissions:
      contents: write

  publish-tp-analyzers:
    if: startsWith(github.ref, 'refs/tags/tp-analyzers-v')
    needs: release-tp-analyzers
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-tp-falco:
    if: startsWith(github.ref, 'refs/tags/tp-falco-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune.Falco
      tag-prefix: tp-falco-v
      fsproj-path: src/TestPrune.Falco/TestPrune.Falco.fsproj
    permissions:
      contents: write

  publish-tp-falco:
    if: startsWith(github.ref, 'refs/tags/tp-falco-v')
    needs: release-tp-falco
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-tp-sql:
    if: startsWith(github.ref, 'refs/tags/tp-sql-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune.Sql
      tag-prefix: tp-sql-v
      fsproj-path: src/TestPrune.Sql/TestPrune.Sql.fsproj
    permissions:
      contents: write

  publish-tp-sql:
    if: startsWith(github.ref, 'refs/tags/tp-sql-v')
    needs: release-tp-sql
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-tp-sqlhydra:
    if: startsWith(github.ref, 'refs/tags/tp-sqlhydra-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune.SqlHydra
      tag-prefix: tp-sqlhydra-v
      fsproj-path: src/TestPrune.SqlHydra/TestPrune.SqlHydra.fsproj
    permissions:
      contents: write

  publish-tp-sqlhydra:
    if: startsWith(github.ref, 'refs/tags/tp-sqlhydra-v')
    needs: release-tp-sqlhydra
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
      - uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # One tag for the recorder, the weaver/tooling and the measurement CLI: the weaver
  # emits calls to recorder methods by name, so the three must never ship apart.
  release-tp-trace:
    if: startsWith(github.ref, 'refs/tags/tp-trace-v')
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-release.yml@main
    with:
      package-name: TestPrune.Trace
      tag-prefix: tp-trace-v
      fsproj-path: src/TestPrune.Trace/TestPrune.Trace.fsproj
      extra-fsproj-paths: 'src/TestPrune.Trace.Recorder/TestPrune.Trace.Recorder.fsproj,src/TestPrune.Trace.Cli/TestPrune.Trace.Cli.fsproj'
    permissions:
      contents: write

  publish-tp-trace:
    if: startsWith(github.ref, 'refs/tags/tp-trace-v')
    needs: release-tp-trace
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts
