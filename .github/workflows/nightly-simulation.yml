name: Nightly async simulation

# ADR-078 / AUTOMATION-1695: CI runs each deterministic simulation (the Store, SupervisedWork,
# DebouncedWork, the repository endpoint's frames) over a FIXED band of seeds, 1..1,000, so the
# interleavings it reaches and the coverage it contributes are the same on every run. This job
# explores 100,000 FRESH seeds per simulation every night, under the same zero-violation rule.
#
# A violation fails the job and prints its seed, its theorem and its history; the seed replays
# alone (FSHW_SIM_SEED=<seed> FSHW_SIM_HISTORIES=1). Every seed found failing gets a ticket and
# a line in tests/FsHotWatch.Tests/SimRegressions.txt, which CI runs on every run beside the
# band: a nightly failure becomes a permanent CI case. It is never an "expected" class.
#
# The 100,000 run as ten batches of 10,000, each its own test run, so no single test outruns
# the suite's synchronous-test cap (SyncHangBackstopMs).

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # Same band as global.json and ci.yml.
          dotnet-version: '10.0.4xx'
      - run: dotnet tool restore
      - run: dotnet build tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj
      - name: Explore 100,000 fresh seeds per simulation
        shell: bash
        run: |
          set -euo pipefail
          # A band no earlier night used: one per day since the epoch, clear of CI's 1..1000.
          day=$(( $(date -u +%s) / 86400 ))
          first=$(( (day % 20000) * 100000 + 1000000 ))
          echo "first seed: $first"
          for batch in $(seq 0 9); do
            seed=$(( first + batch * 10000 ))
            echo "::group::seeds $seed..$(( seed + 9999 ))"
            FSHW_SIM_SEED=$seed FSHW_SIM_HISTORIES=10000 dotnet test --no-build \
              --project tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj \
              --filter-class FsHotWatch.Tests.StoreSimulationTests \
              --filter-class FsHotWatch.Tests.SupervisedWorkSimulationTests \
              --filter-class FsHotWatch.Tests.DebouncedWorkSimulationTests \
              --filter-class FsHotWatch.Tests.FrameSimulationTests
            echo "::endgroup::"
          done
