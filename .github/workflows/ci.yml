name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-build.yml@main
    with:
      solution: FsHotWatch.slnx
      fantomas-paths: 'src/ tests/'
      # Apply our coverage exclusions on CI too — without this, the reusable
      # workflow's `dotnet test --coverage` ignores coverage.settings and the
      # sibling TestPrune.Core sources leak into the cobertura XML at 0%.
      # Relative path — the workflow's `dotnet test` runs from the repo root.
      test-extra-args: '--coverage-settings coverage.settings'
      # `check --run-once` is the single gate after the verb collapse — it runs
      # the AnalyzersPlugin (hosting FSharpLint on the warm FSharpChecker) along
      # with the rest of the plugins. The old per-plugin `analyze` verb is retired.
      #
      # This is ALSO how the repo's own convention rules run in CI
      # (analyzers/FsHotWatch.Rules → FSHW-CLAIM-001, FSHW-CLOCK-001): the
      # solution build above compiles them (they are a member of FsHotWatch.slnx),
      # and `.fshw.json` points `analyzers.paths` at their Debug bin. If that bin
      # is missing, the daemon does NOT silently skip them — `analyzerPathFailures`
      # raises `config error: Analyzer path(s) loaded 0 analyzers` and this step
      # exits 2. An unloaded analyzer and a clean one must never look alike.
      lint-cmd: 'dotnet run --project src/FsHotWatch.Cli --no-build -- check --run-once'
