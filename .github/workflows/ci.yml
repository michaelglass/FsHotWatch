name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Release recovery: semantic-version bump commits must have an exact green CI
  # run before their tag can be published, so maintainers need a safe retry path.
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-build.yml@main
    with:
      solution: FsHotWatch.slnx
      # Same SDK feature band as global.json. Branch coverage counts depend on
      # the F# compiler, which changes per band (10.0.3xx and 10.0.4xx instrument
      # different branch totals for identical code). Keeping Linux CI and local
      # macOS on one band keeps both platforms' floors measuring the same thing.
      # Move both together, and re-measure the floors when you do.
      dotnet-version: '10.0.4xx'
      fantomas-paths: 'src/ tests/ examples/'
      # jj for RepositoryIdentityTests' real-jj case, which on CI fails rather than skips
      # when jj is missing (AUTOMATION-1025). Runs before the build, in the job that tests.
      pre-build-cmd: 'bash scripts/install-jj.sh'
      # No `test-extra-args`: each test project carries its coverage filters in its own
      # testconfig.json (MTP reads it next to the test app), because the projects need
      # DIFFERENT filters — FsHotWatch.Tests excludes the TestPrune assemblies it loads, while
      # TestPrune.Tests measures exactly those — and one `--coverage-settings` would apply to
      # all of them (MTP also refuses a run given both). The workflow's test step runs every
      # tests/**/*.Tests.fsproj and checks every coverage-ratchet-*.json: FsHotWatch,
      # TestPrune and TestPrune.Trace.
      # `confirm --run-once` runs the FULL suite and confirms `check` told the truth,
      # and that is what CI runs — not `check` itself.
      #
      # The difference is the whole point. `check` keeps impact filtering: it answers
      # "did my change break anything it plausibly touches?", which is a latency
      # optimization for the inner dev loop. `confirm` answers "is the suite green?",
      # which is a correctness claim, and it will not make that claim from a filtered
      # run: it disables impact filtering, RUNS the full suite (forcing it if the scan
      # did not already provoke one), and refuses a green verdict — exit 3,
      # `UnearnedScope` — from anything less. See -117.
      #
      # WHY THIS IS NOT MERELY COSMETIC. CI used to run `check --run-once`, and it
      # happened to run the whole suite anyway, because a CI checkout starts with a
      # COLD impact DB and a cold DB selects everything. That is an accident of the
      # environment, not a property of the tool: cache the `.fshw` state between runs,
      # restore the DB, or optimise CI at all, and the same green would silently start
      # coming from a SUBSET, with nothing in the output to say so. `confirm` makes the
      # full-suite scope a checked precondition of the exit code instead of a lucky
      # side effect — and `--run-once` is what makes it reachable here at all, since it
      # is the only path that needs no daemon.
      #
      # NOTE ON "FULL SUITE": it means every test project `.fshw.json` knows about,
      # which today is FsHotWatch.Tests, FsHotWatch.Bench.Tests, TestPrune.Tests and
      # TestPrune.Trace.Tests: TestPrune is gated by fshw built from this source, not by a
      # released pin (AUTOMATION-1367). FsHotWatch.IntegrationTests is in the
      # solution and is DECLARED OUT of that scope — `.fshw.json`'s `tests.excluded`
      # carries the project and the reason, the config load prints it, and the verdict
      # records it under `scope.excluded`. Since an unlisted test project became a config error, the
      # omission cannot be silent: a solution test project that is neither gated nor excluded-with-a-reason
      # is a `config error` and this step exits 2 before any suite runs, exactly like the
      # analyzer-path guard below. The integration suite is NOT covered by the reusable
      # workflow: its test step runs `tests/**/*.Tests.fsproj` only, a pattern
      # FsHotWatch.IntegrationTests.fsproj does not match. The `integration` job below
      # runs it.
      #
      # This is ALSO how the repo's own convention rules run in CI
      # (analyzers/FsHotWatch.Rules → FSHW-CLAIM-001, FSHW-CLOCK-001): the
      # solution build above compiles them (they are a member of FsHotWatch.slnx),
      # and `.fshw.json` points `analyzers.paths` at their Debug bin. If that bin
      # is missing, the daemon does NOT silently skip them — `analyzerPathFailures`
      # raises `config error: Analyzer path(s) loaded 0 analyzers` and this step
      # exits 2. An unloaded analyzer and a clean one must never look alike.
      #
      # `check-msbuild-deps` RUNS HERE, not only in `mise run ci`.
      # `Microsoft.NET.StringTools` is a TRANSITIVE dependency of the CLI that nothing
      # in this repo names; an unrelated bump once moved it backwards, MSBuild project
      # loading threw for EVERY project in the consuming repository, and the CLI was
      # published and adopted before anyone noticed. The first version of that guard was
      # a mise `depends` entry, and mise is not what CI runs — so the guard existed and
      # the publish path never touched it. It is a prefix on this command instead, which
      # is the string CI actually executes, and `&&` means a downgrade stops the job
      # before `confirm` is reached. The solution build above supplies the
      # `FsHotWatch.Cli.deps.json` it reads. This is also what puts the guard on the
      # PUBLISH path: the tagger requires a green run of this workflow before it will
      # cut the tag that `release.yml` publishes from.
      lint-cmd: 'dotnet fsi scripts/check-msbuild-deps.fsx && dotnet fsi scripts/check-package-floors.fsx -- pack && dotnet run --project src/FsHotWatch.Cli --no-build -- confirm --run-once'

  # The end-to-end suite `.fshw.json` keeps out of the daemon's test slot (see its
  # `tests.excluded` reason). Its own job rather than a step of `build`: it runs in
  # parallel instead of adding to that job's wall-clock, and it keeps the box to itself,
  # since these tests assert on wall-clock behaviour. The test step MUST stay identical
  # to the integration half of `mise run ci` (`CiParityTests` pins it).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # Same band as global.json and the build job above.
          dotnet-version: '10.0.4xx'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore
      - name: Integration tests
        run: dotnet test --project tests/FsHotWatch.IntegrationTests/FsHotWatch.IntegrationTests.fsproj --no-build

  # A NEWER-major .NET SDK installed beside the pinned one (AUTOMATION-1631). GitHub rolls runner
  # images without notice: ubuntu-26.04 image 20261111.196 added SDK 11.0.100, and every scratch
  # repository with no global.json then resolved it. The daemon loaded an MSBuild its runtime could
  # not host (AUTOMATION-1621) and three fixtures restored a tool under one SDK and ran it under
  # another. Which image a job draws is chance, so this job installs the newer SDK itself and runs
  # every suite, so the next image roll cannot be the first to find the next such defect. When
  # FsHotWatch moves to a new major (AUTOMATION-1622), the second version becomes the major after it.
  newer-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # The pinned band (global.json), and the next major beside it.
          dotnet-version: '10.0.4xx'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.100'
      - run: dotnet --list-sdks
      - run: bash scripts/install-jj.sh
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --project tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj --no-build
      - run: dotnet test --project tests/FsHotWatch.IntegrationTests/FsHotWatch.IntegrationTests.fsproj --no-build
      - run: dotnet test --project tests/TestPrune.Tests/TestPrune.Tests.fsproj --no-build

  # The read-set audit (ADR-059 §35 Change 1b, §37; AUTOMATION-1634): an action that reads a file
  # its key does not declare fails. The FCS half (a real check under FCS's file-system shim) runs
  # on every platform and in the build job's suite too; the child-process half traces with strace,
  # which only Linux has, so this job installs it and sets FSHW_READ_SET_STRACE=required: a missing
  # strace FAILS the strace controls here instead of skipping them. §35 Change 2's switch requires
  # this job green. The `command -v` guard keeps the step a no-op where strace is already present
  # (ci-linux's image carries it and has no sudo).
  read-set-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # Same band as global.json and the build job above.
          dotnet-version: '10.0.4xx'
      - run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore
      - name: Read-set audit
        run: FSHW_READ_SET_STRACE=required dotnet test --project tests/FsHotWatch.Tests/FsHotWatch.Tests.fsproj --no-build --filter-class 'FsHotWatch.Tests.ReadSetAuditTests' --filter-class 'FsHotWatch.Tests.ReadSetAuditTests+FcsShimTests'

  # This is a public repository. Refuse commit messages that carry private references
  # (agent-session links, private hostnames, tracker URLs) in the commits this push or
  # pull request adds. jj runs no hooks, so this and the `check-commit-messages` task
  # `mise run ci` depends on are the only places such a message can be stopped. A push
  # cannot be un-published by a red here; the red says to reword before the next one.
  # ci-linux runs this job on a tarball with no history, where the script says SKIPPED.
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUSH_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Commit messages carry no private references
        run: bash scripts/check-commit-messages.sh --git-base "$PUSH_BASE"

  lint-project:
    uses: michaelglass/MichaelsWackyFsPackageTools/.github/workflows/michaels-wacky-lint-project.yml@main
    with:
      # global.json accepts only 10.0.4xx patches; the default '10.0.x' could
      # install an SDK it refuses.
      dotnet-version: '10.0.4xx'
    permissions:
      contents: read
